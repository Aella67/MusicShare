{% extends "base.html" %}
{% block title %}{{ code }} - MusicShare{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card text-center">
      <div class="card-body py-5">
        <p class="display-1 fw-bold text-secondary mb-2">{{ code }}</p>
        <h1 class="h3 mb-3">{{ title }}</h1>
        <p class="text-muted mb-4">{{ message }}</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
          <a href="{{ url_for('home') }}" class="btn btn-primary">Back to home</a>
          {% if current_user %}
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Go to dashboard</a>
          {% else %}
            <a href="{{ url_for('join') }}" class="btn btn-outline-secondary">Join a room</a>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
